# Auto-login ash on tty1 only; fish starts Hyprland, which locks itself immediately.
[Service]
Environment=HYPR_AUTOLOGIN=1
ExecStart=
ExecStart=-/usr/sbin/agetty --autologin ash --login-options "-p -f -- \\u" --noreset --noclear --issue-file=/etc/issue:/etc/issue.d:/run/issue.d:/usr/lib/issue.d - ${TERM}
