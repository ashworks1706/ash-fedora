# Vim-style keybindings
setw -g mode-keys vi
set -g status-keys vi

# Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Vim-style pane resizing
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Vim-style copy mode
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle

# Split windows with vim-style keys
bind v split-window -h -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"

# Easier prefix (Alt-a, one-handed)
unbind C-b
set -g prefix M-a
bind M-a send-prefix

# Shell, colors and kitty integration
set -g default-shell /usr/bin/fish
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-kitty:RGB"
set -g allow-passthrough on
set -g set-clipboard on
set -g mouse on
set -ga update-environment " WAYLAND_DISPLAY XDG_RUNTIME_DIR DBUS_SESSION_BUS_ADDRESS HYPRLAND_INSTANCE_SIGNATURE"

# Size to whichever client is active (laptop screen or Mac window)
set -g window-size latest
setw -g aggressive-resize on

# Session picker and kill (prefix s is taken by split)
bind S choose-tree -Zs
bind X confirm-before -p "kill session #S? (y/n)" kill-session

# Set plugin manager path
set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.tmux/plugins/'

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Automatic restore on tmux start
set -g @continuum-restore 'on'

# Auto-save sessions every 15 minutes
set -g @continuum-save-interval '15'

# Also restart these programs on restore
set -g @resurrect-processes 'btop nvtop yazi ssh "~npm run dev" "~python -m http.server"'

# Restore pane contents
set -g @resurrect-capture-pane-contents 'on'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
