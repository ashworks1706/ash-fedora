# You can put extra environment variables here
# https://wiki.hyprland.org/Configuring/Environment-variables/
env = BROWSER, /var/lib/flatpak/exports/bin/com.brave.Browser
env = XDG_DEFAULT_BROWSER, com.brave.Browser.desktop

# Prefer AMD iGPU for Hyprland compositor, fall back to NVIDIA dGPU (stable udev names)
env = AQ_DRM_DEVICES,/dev/dri/amd-igpu:/dev/dri/nvidia-dgpu

# NVIDIA Hybrid Graphics (offload only) -- keep commented so the compositor stays on AMD
# env = LIBVA_DRIVER_NAME,nvidia
# env = GBM_BACKEND,nvidia-drm
# env = __GLX_VENDOR_LIBRARY_NAME,nvidia
# env = WLR_NO_HARDWARE_CURSORS,1
