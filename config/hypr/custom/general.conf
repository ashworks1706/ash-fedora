# Performance-oriented overrides to keep the desktop responsive while still allowing light animations.
# More vars: https://wiki.hyprland.org/Configuring/Variables/

general {
    # Pull workspace previews closer to reduce overdraw
    gaps_workspaces = 16
}

decoration {
    rounding = 10

    # Blur and shadows are the biggest perf sinks; keep them minimal by default.
    blur {
        enabled = false
        size = 6
        passes = 1
        brightness = 1
        noise = 0.01
        contrast = 1
    }

    shadow {
        enabled = true
        range = 8
        offset = 0 2
        render_power = 2
        color = rgba(00000030)
    }

    dim_inactive = false
    dim_special = 0.0
}

animations {
    enabled = false 
    bezier = snappy, 0.08, 0.86, 0.18, 1.0
    animation = windows, 1, 4, snappy, popin 92%
    animation = windowsOut, 1, 3, snappy, popin 90%
    animation = windowsMove, 1, 4, snappy, slide
    animation = border, 1, 2, snappy
    animation = fade, 1, 3, default
    animation = layers, 1, 3, snappy, popin 95%
    animation = workspaces, 1, 5, snappy, slide
}

misc {
    vrr = 0
    animate_manual_resizes = false
    animate_mouse_windowdragging = false
}

# ASUS G14 touchpad override:
# Make physical click behave as primary click regardless of left/right clickpad area.
device {
    name = asuf1204:00-2808:0201-touchpad
    clickfinger_behavior = true
    tap-to-click = true
    middle_button_emulation = false
    disable_while_typing = true
    natural_scroll = true
}
