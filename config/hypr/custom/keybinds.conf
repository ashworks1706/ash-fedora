# See https://wiki.hyprland.org/Configuring/Binds/
#!
##! User
bind = Ctrl+Super, Slash, exec, xdg-open ~/.config/illogical-impulse/config.json # Edit shell config
bind = Ctrl+Super+Alt, Slash, exec, xdg-open ~/.config/hypr/custom/keybinds.conf # Edit extra keybinds
bind = Super+Shift, Slash, exec, zeal # Offline docs (Zeal)

# Add stuff here
# Use #! to add an extra column on the cheatsheet
# Use ##! to add a section in that column
# Add a comment after a bind to add a description, like above

##! Performance toggles
bind = Ctrl+Super+Alt, 1, exec, hyprctl keyword animations:enabled 0 && hyprctl keyword decoration:blur:enabled 0 && hyprctl keyword decoration:shadow:enabled 0 # Kill heavy effects
bind = Ctrl+Super+Alt, 2, exec, hyprctl keyword animations:enabled 1 && hyprctl keyword decoration:blur:enabled 0 && hyprctl keyword decoration:shadow:enabled 1 # Light effects (default)
bind = Ctrl+Super+Alt, 3, exec, hyprctl keyword animations:enabled 1 && hyprctl keyword decoration:blur:enabled 1 && hyprctl keyword decoration:shadow:enabled 1 # Full effects

##! Workspace
bind = Super+Alt, Left, exec, ~/.config/hypr/hyprland/scripts/workspace_shift_all.sh r-1 # Move all windows to previous workspace
bind = Super+Alt, Right, exec, ~/.config/hypr/hyprland/scripts/workspace_shift_all.sh r+1 # Move all windows to next workspace

##! tmux (prefix Alt+A, then key)
#/# bind = Alt, A → Shift+S,, # Pick session
#/# bind = Alt, A → D,, # Detach (keeps running)
#/# bind = Alt, A → Shift+X,, # Kill session
#/# bind = Alt, A → C,, # New window
#/# bind = Alt, A → Comma,, # Rename window
#/# bind = Alt, A → Shift+4 ($),, # Rename session
#/# bind = Alt, A → N / P,, # Next / previous window
#/# bind = Alt, A → V,, # Split side by side
#/# bind = Alt, A → S,, # Split top/bottom
#/# bind = Alt, A → H/J/K/L,, # Focus pane
#/# bind = Alt, A → Shift+H/J/K/L,, # Resize pane
#/# bind = Alt, A → Z,, # Zoom pane
#/# bind = Alt, A → [,, # Scroll/copy (v select, y copy)
#/# bind = Alt, A → Ctrl+S / Ctrl+R,, # Save / restore sessions

#!
##! Mac ↔ laptop (Tailscale)
#/# bind = Mac, ssh -t ash@ash-fedora t,, # Attach to laptop tmux
#/# bind = Mac, ssh ash@ash-fedora,, # Fresh shell on laptop
#/# bind = Mac, Option+A,, # tmux prefix (Option as Meta on)
#/# bind = Mac, Option+drag → Cmd+C,, # Copy terminal text
#/# bind = Mac, scp f ash@ash-fedora:~/Downloads/,, # Send file to laptop
#/# bind = Mac, scp ash@ash-fedora:~/path/f ~/Desktop/,, # Pull file from laptop
#/# bind = Mac, scp -r dir ash@ash-fedora:~/,, # Send folder to laptop
#/# bind = Mac, rsync -avz dir/ ash@ash-fedora:~/dir/,, # Sync folder (changes only)
#/# bind = Linux, tailscale file cp f __MAC_HOST__:,, # Send file to Mac (Taildrop)
#/# bind = Linux, tailscale file get ~/Downloads,, # Receive files from Mac
#/# bind = Linux, tailscale status,, # See devices online
#/# bind = Linux, remote-off,, # Turn all remote access off (stays off)
#/# bind = Linux, remote-on,, # Turn it all back on
