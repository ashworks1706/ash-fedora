# See https://wiki.hyprland.org/Configuring/Binds/
#!
##! User
bind = Ctrl+Super, Slash, exec, xdg-open ~/.config/illogical-impulse/config.json # Edit shell config
bind = Ctrl+Super+Alt, Slash, exec, xdg-open ~/.config/hypr/custom/keybinds.conf # Edit extra keybinds

# Add stuff here
# Use #! to add an extra column on the cheatsheet
# Use ##! to add a section in that column
# Add a comment after a bind to add a description, like above

##! Performance toggles
bind = Ctrl+Super+Alt, 1, exec, hyprctl keyword animations:enabled 0 && hyprctl keyword decoration:blur:enabled 0 && hyprctl keyword decoration:shadow:enabled 0 # Kill heavy effects
bind = Ctrl+Super+Alt, 2, exec, hyprctl keyword animations:enabled 1 && hyprctl keyword decoration:blur:enabled 0 && hyprctl keyword decoration:shadow:enabled 1 # Light effects (default)
bind = Ctrl+Super+Alt, 3, exec, hyprctl keyword animations:enabled 1 && hyprctl keyword decoration:blur:enabled 1 && hyprctl keyword decoration:shadow:enabled 1 # Full effects

##! Workspace
bind = Super+Alt, Left, exec, ~/.config/hypr/hyprland/scripts/workspace_shift_all.sh r-1 # Move all windows to previous workspace
bind = Super+Alt, Right, exec, ~/.config/hypr/hyprland/scripts/workspace_shift_all.sh r+1 # Move all windows to next workspace

##! Remote services
bind = Super+Shift, code:18, exec, ~/.config/hypr/scripts/RemoteServices.sh # Toggle Tailscale + WayVNC (single-session remote)
