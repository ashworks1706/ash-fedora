# You can make apps auto-start here
# Relevant Hyprland wiki section: https://wiki.hyprland.org/Configuring/Keywords/#executing

# Remote desktop host for Moonlight (see ~/.config/sunshine)
exec-once = sh -c '[ -e ~/.config/remote-off ] || sunshine'  # remote-off disables it

# Auto-login after reboot: lock immediately (manual logins have no HYPR_AUTOLOGIN)
exec-once = sh -c '[ "$HYPR_AUTOLOGIN" = 1 ] && sleep 1 && (pidof hyprlock || hyprlock)'
