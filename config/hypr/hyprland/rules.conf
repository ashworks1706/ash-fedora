# ######## Window rules ########

# Uncomment to apply global transparency to all windows:
# window = opacity 0.89 override 0.89 override, class:.*

# Disable blur for xwayland context menus
window = noblur,class:^()$,title:^()$
# window = noblur, xwayland:1


# Floating
window = center, title:^(Open File)(.*)$
window = float, title:^(Open File)(.*)$
window = center, title:^(Select a File)(.*)$
window = float, title:^(Select a File)(.*)$
window = center, title:^(Choose wallpaper)(.*)$
window = float, title:^(Choose wallpaper)(.*)$
window = size 60% 65%, title:^(Choose wallpaper)(.*)$
window = center, title:^(Open Folder)(.*)$
window = float, title:^(Open Folder)(.*)$
window = center, title:^(Save As)(.*)$
window = float, title:^(Save As)(.*)$
window = center, title:^(Library)(.*)$
window = float, title:^(Library)(.*)$
window = center, title:^(File Upload)(.*)$
window = float, title:^(File Upload)(.*)$
window = center, title:^(.*)(wants to save)$
window = float, title:^(.*)(wants to save)$
window = center, title:^(.*)(wants to open)$
window = float, title:^(.*)(wants to open)$
window = float, class:^(blueberry\.py)$
window = float, class:^(guifetch)$   # FlafyDev/guifetch
window = float, class:^(pavucontrol)$
window = size 45%, class:^(pavucontrol)$
window = center, class:^(pavucontrol)$
window = float, class:^(org.pulseaudio.pavucontrol)$
window = size 45%, class:^(org.pulseaudio.pavucontrol)$
window = center, class:^(org.pulseaudio.pavucontrol)$
window = float, class:^(nm-connection-editor)$
window = size 45%, class:^(nm-connection-editor)$
window = center, class:^(nm-connection-editor)$
window = float, class:.*plasmawindowed.*
window = float, class:kcm_.*
window = float, class:.*bluedevilwizard
window = float, title:.*Welcome
window = float, title:^(illogical-impulse Settings)$
window = float, title:.*Shell conflicts.*
window = float, class:org.freedesktop.impl.portal.desktop.kde
window = size 60% 65%, class:org.freedesktop.impl.portal.desktop.kde
window = float, class:^(Zotero)$
# -----------------------------------------------------
# Floating, Centering, and Resizing Rules

# Discord
windowrule = match:title .*[Dd]iscord.*, float on, size 1600 900

# Slack
windowrule = match:title .*[Ss]lack.*, float on, center on, size 1400 820

# Spotify
windowrule = match:initial_class ^(spotify)$, match:initial_title ^(Spotify Premium)$, float on, size 2000 950

# Thunderbird
windowrule = match:title .*[Tt]hunderbird.*, float on, size 2000 950

# GNOME Text Editor 
windowrule = match:class ^(org\.gnome\.TextEditor)$, float on, center on, size 1200 900

# Kitty Terminal
windowrule = match:class ^(kitty)$, float on, center on, size 1400 820

# Workspace Assignments

# Tiling
window = tile, class:^dev\.warp\.Warp$

# Picture-in-Picture
window = float, title:^([Pp]icture[-\s]?[Ii]n[-\s]?[Pp]icture)(.*)$
window = keepaspectratio, title:^([Pp]icture[-\s]?[Ii]n[-\s]?[Pp]icture)(.*)$
window = move 73% 72%, title:^([Pp]icture[-\s]?[Ii]n[-\s]?[Pp]icture)(.*)$ 
window = size 25%, title:^([Pp]icture[-\s]?[Ii]n[-\s]?[Pp]icture)(.*)$
window = float, title:^([Pp]icture[-\s]?[Ii]n[-\s]?[Pp]icture)(.*)$
window = pin, title:^([Pp]icture[-\s]?[Ii]n[-\s]?[Pp]icture)(.*)$

# --- Tearing ---
window = immediate, title:.*\.exe
window = immediate, title:.*minecraft.*
window = immediate, class:^(steam_app).*

# Fix Jetbrain IDEs focus/rerendering problem
window=noinitialfocus,class:^jetbrains-.*$,floating:1,title:^$|^\s$|^win\d+$

# No shadow for tiled windows (matches windows that are not floating).
window = noshadow, floating:0

# ######## Workspace rules ########
workspace = special:special, gapsout:30

